<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Push Day Killer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: -apple-system, system-ui, sans-serif; color: #fff; touch-action: none; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; }
  #cam { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); background: #111; }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; }
  #ui { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; padding-top: calc(24px + env(safe-area-inset-top)); background: rgba(0,0,0,.55); }
  #ui.hidden { display: none; }
  h1 { font-size: 40px; margin: 0 0 8px; letter-spacing: -1px; }
  p { font-size: 17px; line-height: 1.4; margin: 6px 0; opacity: .9; max-width: 340px; }
  .big { font-size: 96px; font-weight: 800; margin: 0; line-height: 1; }
  button { margin-top: 20px; font-size: 20px; font-weight: 700; padding: 16px 36px; border: 0; border-radius: 999px; background: #ffd23f; color: #000; }
  button:active { transform: scale(.97); }
  #hud { position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-size: 56px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,.7); pointer-events: none; }
  #hint { position: absolute; bottom: calc(24px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 15px; text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none; opacity: .85; }
  #who { position: absolute; top: calc(22px + env(safe-area-inset-top)); left: 16px; font-size: 15px; font-weight: 700; text-shadow: 0 1px 4px rgba(0,0,0,.8); pointer-events: none; opacity: .9; }
  #opts { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }
  #opts button { margin: 0; }
  #opts button.alt { background: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" autoplay muted playsinline></video>
  <canvas id="game"></canvas>
  <div id="hud" class="hidden">0</div>
  <div id="who" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="ui">
    <h1>Push Day Killer 💀</h1>
    <p id="msg">Push-ups or squats steer the diver. Squeeze through the cave.</p>
    <p id="sub"></p>
    <div id="opts"></div>
    <button id="btn">Start</button>
  </div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
const video = $('cam'), canvas = $('game'), ctx = canvas.getContext('2d');
const ui = $('ui'), msg = $('msg'), sub = $('sub'), btn = $('btn'), hud = $('hud'), hint = $('hint'), who = $('who'), opts = $('opts');

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize); resize();

// ---------- Face tracking ----------
let detector = null, faceY = null, faceSeen = false, touchMode = false;
// Which body part drives the diver. Push-ups track the shoulders (11, 12); squats track the hips (23, 24),
// so bending forward at the waist doesn't count as going down.
const EXERCISES = {
  pushup: { idx: [11, 12], part: 'shoulders', setup: 'Prop your phone on the floor in front of you, screen facing you, so it can see your head and shoulders.', top: 'get into push-up position with your arms straight.', bottom: 'Now lower yourself all the way down and hold.' },
  squat:  { idx: [23, 24], part: 'hips', setup: 'Lean your phone against a wall and stand back so the camera sees you from head to knees.', top: 'stand tall, feet shoulder-width apart.', bottom: 'Now squat all the way down and hold.' },
};
let exercise = EXERCISES.pushup;

async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
  video.srcObject = stream;
  await new Promise(r => video.onloadedmetadata = r);
  await video.play();
}

async function loadDetector() {
  const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const { PoseLandmarker, FilesetResolver } = await import(base);
  const vision = await FilesetResolver.forVisionTasks(base + '/wasm');
  const model = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';
  for (const delegate of ['GPU', 'CPU']) {
    try {
      return await PoseLandmarker.createFromOptions(vision, { baseOptions: { modelAssetPath: model, delegate }, runningMode: 'VIDEO', numPoses: 1 });
    } catch (e) { console.warn('delegate failed', delegate, e); }
  }
  throw new Error('Pose tracker failed to load');
}

let lastVideoTime = -1;
function pollFace() {
  if (!detector || video.readyState < 2) return;
  if (video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const res = detector.detectForVideo(video, performance.now());
  const lm = res.landmarks && res.landmarks[0];
  const l = lm && lm[exercise.idx[0]], r = lm && lm[exercise.idx[1]];
  if (l && r && (l.visibility ?? 1) > 0.4 && (r.visibility ?? 1) > 0.4) {
    const y = (l.y + r.y) / 2; // normalised, 0 = top of frame
    faceY = faceY === null ? y : faceY + (y - faceY) * 0.45;
    faceSeen = true;
  } else {
    faceSeen = false;
  }
}

// Touch fallback (no camera): drag finger up/down.
function enableTouchMode() {
  touchMode = true; faceSeen = true; faceY = 0.5; topY = 0.1; botY = 0.9;
  const set = e => { const t = e.touches ? e.touches[0] : e; faceY = Math.min(1, Math.max(0, t.clientY / H)); };
  ['touchstart', 'touchmove', 'mousedown', 'mousemove'].forEach(ev => window.addEventListener(ev, e => { if (ev.startsWith('mouse') && e.buttons === 0) return; set(e); }, { passive: true }));
}

// ---------- Calibration ----------
// topY = face position at the top of a push-up (arms straight), botY = at the bottom.
let topY = 0.35, botY = 0.75;
function birdTargetY() {
  const t = (faceY - topY) / (botY - topY); // 0 at top of push-up, 1 at bottom
  const clamped = Math.min(1, Math.max(0, t));
  return H * (0.12 + clamped * 0.76);
}

function wait(ms) { return new Promise(r => setTimeout(r, ms)); }
async function sample(seconds, label) {
  const vals = [];
  const end = performance.now() + seconds * 1000;
  while (performance.now() < end) {
    const left = Math.ceil((end - performance.now()) / 1000);
    sub.textContent = `${label} … ${left}`;
    if (faceY !== null && faceSeen) vals.push(faceY);
    await wait(100);
  }
  vals.sort((a, b) => a - b);
  return vals.length ? vals[Math.floor(vals.length / 2)] : null;
}

async function calibrate(name) {
  btn.classList.add('hidden');
  msg.textContent = `${name}: ${exercise.top}`;
  sub.textContent = '';
  await wait(1500);
  const t = await sample(3, 'Hold the TOP');
  msg.textContent = exercise.bottom;
  await wait(1500);
  const b = await sample(3, 'Hold the BOTTOM');
  sub.textContent = '';
  if (t === null || b === null || Math.abs(b - t) < 0.05) return null;
  return { top: t, bot: b };
}

// ---------- Game ----------
const BIRD_X_FRAC = 0.3, BIRD_R = 13, HIT_OFFSETS = [-30, -10, 8]; // hit circles along the dog only, slightly inside its outline; the scooter is free
const PIPE_W = 64, GAP_FRAC = 0.30, SPEED = 175, SPAWN_EVERY = 1.7;
let trail = [], trailT = 0;
let pipes = [], birdY = H / 2, score = 0, best = +(localStorage.getItem('pdk-best') || 0), running = false, spawnT = 0, lastT = 0, dead = false;

function reset() {
  pipes = []; trail = []; score = 0; spawnT = 1.2; dead = false;
  birdY = H / 2;
  hud.textContent = scoreBase;
}

function spawnPipe() {
  const gap = H * GAP_FRAC;
  const margin = H * 0.14;
  const gapY = margin + Math.random() * (H - 2 * margin - gap); // top of gap
  pipes.push({ x: W + PIPE_W, gapY, gap, passed: false });
}

function update(dt) {
  pollFace();
  if (faceY !== null) {
    const target = birdTargetY();
    birdY += (target - birdY) * Math.min(1, dt * 10);
  }
  // smoke trail: puffs drop off the tail and drift left with the pipes, tracing where you've been
  trailT -= dt;
  if (trailT <= 0) { trail.push({ x: W * BIRD_X_FRAC - 4, y: birdY - 4, age: 0, r: 2 + Math.random() * 3, drift: (Math.random() - 0.5) * 20 }); trailT = 0.06; }
  for (const s of trail) { s.x -= SPEED * dt; s.age += dt; s.y -= 28 * dt; s.x += s.drift * dt; }
  trail = trail.filter(s => s.age < 3.5 && s.x > -20);
  if (dead) return;
  spawnT -= dt;
  if (spawnT <= 0) { spawnPipe(); spawnT = SPAWN_EVERY; }
  const bx = W * BIRD_X_FRAC;
  for (const p of pipes) {
    p.x -= SPEED * dt;
    if (!p.passed && p.x + PIPE_W < bx) {
      p.passed = true; score++; hud.textContent = scoreBase + score;
      if (gateTarget && score >= gateTarget) { running = false; if (onDeath) onDeath(); return; }
    }
    // collision: hit circles along the diver vs the two rock columns
    for (const off of HIT_OFFSETS) {
      const cx = bx + off;
      const inX = cx + BIRD_R > p.x && cx - BIRD_R < p.x + PIPE_W;
      if (inX && (birdY - BIRD_R < p.gapY || birdY + BIRD_R > p.gapY + p.gap)) { die(); break; }
    }
  }
  pipes = pipes.filter(p => p.x + PIPE_W > -10);
}

let onDeath = null, scoreBase = 0, gateTarget = 0;
function die() {
  dead = true; running = false;
  if (navigator.vibrate) navigator.vibrate(200);
  if (onDeath) onDeath();
}

// Jagged rock spike. dir = 1 hangs from the ceiling (tip at tipY), dir = -1 rises from the floor.
function drawSpike(x, baseY, tipY, dir) {
  const cx = x + PIPE_W / 2, half = PIPE_W / 2 + 4;
  const len = Math.abs(tipY - baseY);
  ctx.fillStyle = '#6b5744'; ctx.strokeStyle = '#2e2419'; ctx.lineWidth = 3; ctx.lineJoin = 'round';
  // main spike with two shoulders, deterministic wobble so the rocks look rough but don't flicker
  const wob = i => Math.sin(i * 12.9898 + x * 0.01) * 4;
  ctx.beginPath();
  ctx.moveTo(cx - half, baseY);
  ctx.lineTo(cx - half + wob(1), baseY + dir * len * 0.45);
  ctx.lineTo(cx - half * 0.55, baseY + dir * len * 0.62);
  ctx.lineTo(cx - half * 0.35 + wob(2), baseY + dir * len * 0.82);
  ctx.lineTo(cx, tipY);
  ctx.lineTo(cx + half * 0.3 + wob(3), baseY + dir * len * 0.8);
  ctx.lineTo(cx + half * 0.55, baseY + dir * len * 0.6);
  ctx.lineTo(cx + half + wob(4), baseY + dir * len * 0.4);
  ctx.lineTo(cx + half, baseY);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  // highlight stripe
  ctx.strokeStyle = 'rgba(255,230,200,.18)'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(cx - half * 0.35, baseY); ctx.lineTo(cx - 3, baseY + dir * len * 0.85); ctx.stroke();
}

function drawTrail() {
  for (const s of trail) {
    const a = Math.max(0, 1 - s.age / 3.5);
    ctx.strokeStyle = `rgba(220,245,255,${(0.8 * a).toFixed(3)})`; ctx.lineWidth = 1.5;
    ctx.fillStyle = `rgba(200,235,255,${(0.25 * a).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + s.age * 2, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = `rgba(255,255,255,${(0.7 * a).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(s.x - s.r * 0.35, s.y - s.r * 0.35, 1.5, 0, Math.PI * 2); ctx.fill();
  }
}

// Scuba dog towed by a sea scooter (diver propulsion vehicle). Faces right.
function drawPlane(x, y, t) {
  ctx.save(); ctx.translate(x, y);
  const v = (faceY !== null ? (birdTargetY() - birdY) : 0);
  ctx.rotate(Math.max(-0.35, Math.min(0.35, v / 150)));
  ctx.scale(1.3, 1.3);
  ctx.lineWidth = 2; ctx.strokeStyle = '#2a1c10'; ctx.lineJoin = 'round';
  const rr = (px, py, w, h, r) => { ctx.beginPath(); ctx.roundRect(px, py, w, h, r); ctx.fill(); ctx.stroke(); };
  const kick = Math.sin(t * 6) * 3;
  // fins (trailing back legs)
  ctx.fillStyle = '#2f80ed';
  ctx.beginPath(); ctx.moveTo(-32, -2 + kick); ctx.lineTo(-52, -8 + kick * 1.5); ctx.lineTo(-50, 2 + kick); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-32, 6 - kick); ctx.lineTo(-52, 4 - kick * 1.5); ctx.lineTo(-50, 14 - kick); ctx.closePath(); ctx.fill(); ctx.stroke();
  // tank on the back
  ctx.fillStyle = '#c9ced4'; rr(-30, -18, 22, 9, 4);
  ctx.strokeStyle = '#2a1c10'; ctx.beginPath(); ctx.moveTo(-9, -14); ctx.quadraticCurveTo(4, -16, 6, -4); ctx.stroke(); // air hose
  // body
  ctx.fillStyle = '#c4884a'; rr(-36, -8, 34, 16, 8);
  // tail
  ctx.beginPath(); ctx.moveTo(-36, -2); ctx.quadraticCurveTo(-46, -12 + kick, -40, -16 + kick); ctx.lineWidth = 4; ctx.strokeStyle = '#c4884a'; ctx.stroke();
  ctx.lineWidth = 2; ctx.strokeStyle = '#2a1c10';
  // ear
  ctx.fillStyle = '#a86f38'; ctx.beginPath(); ctx.ellipse(-12, -8, 5, 8, -0.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // head
  ctx.fillStyle = '#c4884a'; ctx.beginPath(); ctx.arc(-2, -4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // snout + nose
  ctx.fillStyle = '#e9c69a'; ctx.beginPath(); ctx.ellipse(6, 0, 6, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(10, -1, 2.2, 0, Math.PI * 2); ctx.fill();
  // dive mask
  ctx.fillStyle = 'rgba(150,220,255,.85)'; rr(-9, -11, 16, 9, 3);
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(-4, -7, 1.5, 0, Math.PI * 2); ctx.arc(3, -7, 1.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-9, -8); ctx.quadraticCurveTo(-14, -6, -12, -2); ctx.stroke();
  ctx.strokeStyle = '#2a1c10';
  // regulator
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.arc(5, 4, 3, 0, Math.PI * 2); ctx.fill();
  // front paws gripping the handles
  ctx.fillStyle = '#c4884a';
  ctx.beginPath(); ctx.arc(14, -8, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(14, 9, 3.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  // --- sea scooter ---
  ctx.fillStyle = '#333'; ctx.beginPath(); ctx.moveTo(14, -8); ctx.lineTo(20, -8); ctx.moveTo(14, 9); ctx.lineTo(20, 9); ctx.lineWidth = 3; ctx.stroke(); ctx.lineWidth = 2;
  // prop shroud (behind the body, spinning blur inside)
  ctx.fillStyle = '#2b2b2b'; rr(16, -12, 8, 24, 3);
  ctx.save(); ctx.translate(20, 0); ctx.rotate(t * 30); ctx.fillStyle = 'rgba(120,200,255,.6)'; ctx.beginPath(); ctx.ellipse(0, 0, 2, 9, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  // body
  ctx.fillStyle = '#f5c400'; rr(22, -9, 32, 18, 8);
  ctx.fillStyle = '#2b2b2b'; ctx.beginPath(); ctx.moveTo(52, -8); ctx.quadraticCurveTo(64, 0, 52, 8); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#222'; ctx.fillRect(28, -4, 16, 3); // grip stripe
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(10,70,110,.42)'; ctx.fillRect(0, 0, W, H);
  for (const p of pipes) {
    drawSpike(p.x, -20, p.gapY, 1);
    drawSpike(p.x, H + 20, p.gapY + p.gap, -1);
  }
  drawTrail();
  drawPlane(W * BIRD_X_FRAC, birdY, performance.now() / 1000);
  if (running && !touchMode) {
    hint.textContent = faceSeen ? '' : `${exercise.part[0].toUpperCase() + exercise.part.slice(1)} not found`;
  }
}

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  if (running) update(dt); else pollFace();
  draw();
  requestAnimationFrame(loop);
}

// ---------- Flow ----------
// The whole session is one linear async script: tap-to-continue prompts, calibration, then runs.
function tap(label) {
  return new Promise(res => {
    btn.textContent = label; btn.disabled = false; btn.classList.remove('hidden');
    btn.onclick = () => { btn.onclick = null; btn.classList.add('hidden'); res(); };
  });
}
function choose(options) {
  return new Promise(res => {
    btn.classList.add('hidden'); opts.innerHTML = '';
    for (const o of options) {
      const b = document.createElement('button'); b.textContent = o.label; if (o.alt) b.className = 'alt';
      b.onclick = () => { opts.innerHTML = ''; res(o.value); };
      opts.appendChild(b);
    }
  });
}
function showUI(text, subText = '') { msg.innerHTML = text; sub.textContent = subText; ui.classList.remove('hidden'); }

async function calibratePlayer(name) {
  if (touchMode) return { top: 0.1, bot: 0.9 };
  for (;;) {
    const cal = await calibrate(name);
    if (cal) return cal;
    showUI(`I couldn't see your ${exercise.part} move enough. ${exercise.setup} Then try again.`);
    await tap('Retry');
  }
}

// One run: countdown, play until death (or until `target` gates are cleared), resolve with {score, died}.
// `swapText` turns the countdown into a 3-second player swap.
async function playRun(cal, label, { swapText = '', target = 0, base = 0 } = {}) {
  topY = cal.top; botY = cal.bot;
  const step = swapText ? 1000 : 700;
  for (const n of ['3', '2', '1']) { showUI(`<span class="big">${n}</span>`, swapText); await wait(step); }
  showUI('<span class="big">GO</span>', swapText); await wait(500);
  scoreBase = base; gateTarget = target;
  reset();
  who.textContent = label; who.classList.toggle('hidden', !label);
  ui.classList.add('hidden'); hud.classList.remove('hidden'); hint.classList.remove('hidden');
  running = true;
  await new Promise(res => { onDeath = res; });
  onDeath = null;
  hint.classList.add('hidden'); who.classList.add('hidden'); hud.classList.add('hidden');
  return { score, died: dead };
}

async function solo() {
  const cal = await calibratePlayer('You');
  for (;;) {
    const { score: s } = await playRun(cal, '');
    best = Math.max(best, s); localStorage.setItem('pdk-best', best);
    showUI(`<span class="big">${s}</span><br>gaps cleared`, `Best: ${best}`);
    await tap('Play again');
  }
}

async function calibrateBoth() {
  const players = [{ name: 'Player 1', cal: null, score: 0 }, { name: 'Player 2', cal: null, score: 0 }];
  for (const p of players) {
    showUI(`${p.name}: get in position in front of the camera.`);
    await tap(`${p.name} ready`);
    p.cal = await calibratePlayer(p.name);
  }
  return players;
}
const totals = (a, b) => `${a.name}: ${a.score} · ${b.name}: ${b.score}`;

async function versus() {
  showUI('How many lives each?');
  const lives = await choose([{ label: '3', value: 3 }, { label: '5', value: 5 }, { label: '7', value: 7 }]);
  const players = await calibrateBoth();
  for (;;) {
    for (const p of players) p.score = 0;
    showUI(`${players[0].name}, you're up first.`);
    await tap(`${players[0].name} ready`);
    let first = true;
    for (let life = 1; life <= lives; life++) {
      for (const p of players) {
        const { score: s } = await playRun(p.cal, `${p.name} · life ${life}/${lives}`, { swapText: first ? '' : `${p.name}, swap in! Life ${life} of ${lives}` });
        first = false;
        p.score += s;
        showUI(`<span class="big">${s}</span><br>${p.name} cleared ${s} gate${s === 1 ? '' : 's'}`, totals(...players));
        await wait(1500);
      }
    }
    const [a, b] = players;
    const title = a.score === b.score ? 'Draw!' : `${a.score > b.score ? a.name : b.name} wins!`;
    showUI(`<span class="big">${title}</span>`, totals(a, b));
    const again = await choose([{ label: 'Rematch', value: true }, { label: 'New players', value: false, alt: true }]);
    if (!again) return location.reload();
  }
}

// Co-op: one shared score. Players alternate, each going until they crash. A turn "passes" if it reaches
// the pass mark; the team is out once both players fall short back to back.
async function coop() {
  showUI('Pass mark per turn? Two short turns in a row and the team is out.');
  const passMark = await choose([{ label: '5', value: 5 }, { label: '10', value: 10 }]);
  const players = await calibrateBoth();
  let teamBest = +(localStorage.getItem('pdk-coop-best') || 0);
  for (;;) {
    let total = 0, fails = 0, turn = 0;
    showUI(`${players[0].name}, you're up first. Go until you crash.`, `Clear ${passMark}+ gates to keep the team safe.`);
    await tap(`${players[0].name} ready`);
    while (fails < 2) {
      const p = players[turn % 2]; turn++;
      const r = await playRun(p.cal, `${p.name} · pass mark ${passMark}`, { swapText: turn === 1 ? '' : `${p.name}, swap in!`, base: total });
      total += r.score;
      const passed = r.score >= passMark;
      fails = passed ? 0 : fails + 1;
      showUI(`<span class="big">${r.score}</span><br>${p.name} ${passed ? 'made the pass mark' : fails < 2 ? `fell short — one more and it's over` : 'fell short'}`, `Team total: ${total}`);
      await wait(1500);
    }
    teamBest = Math.max(teamBest, total); localStorage.setItem('pdk-coop-best', teamBest);
    showUI(`<span class="big">${total}</span><br>gates as a team`, `Best team score: ${teamBest}`);
    const again = await choose([{ label: 'Go again', value: true }, { label: 'New players', value: false, alt: true }]);
    if (!again) return location.reload();
  }
}

async function main() {
  await tap('Start');
  btn.disabled = true;
  try {
    showUI('Loading pose tracker…');
    detector = await loadDetector();
  } catch (e) {
    console.error(e);
    showUI('Pose tracker failed to load. Check your connection and retry.');
    await tap('Retry'); return main();
  }
  try {
    showUI('Starting camera…');
    await startCamera();
  } catch (e) {
    console.error(e);
    showUI('Camera not available. Touch mode: drag your finger up and down to swim.');
    enableTouchMode();
  }
  showUI('Which exercise?');
  const ex = await choose([{ label: 'Push-ups', value: 'pushup' }, { label: 'Squats', value: 'squat', alt: true }]);
  exercise = EXERCISES[ex];
  showUI(exercise.setup, 'Who\'s playing?');
  const mode = await choose([{ label: 'Solo', value: 'solo' }, { label: '2P Versus', value: 'versus', alt: true }, { label: '2P Co-op', value: 'coop', alt: true }]);
  if (mode === 'solo') await solo(); else if (mode === 'versus') await versus(); else await coop();
}
main();

window.__pdk = { get pipes() { return pipes; }, get birdY() { return birdY; } }; // debug hook
requestAnimationFrame(loop);
</script>
</body>
</html>
